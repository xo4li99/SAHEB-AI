<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071714"><title>SAHEB AI</title><style>
*{box-sizing:border-box}body{margin:0;background:#071714;color:#f7f4ea;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit;border:0}.app{max-width:520px;margin:auto;min-height:100vh;background:#0b1e1a;position:relative;overflow:hidden}.top{position:absolute;z-index:5;top:0;left:0;right:0;padding:18px 18px 0;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;letter-spacing:2px;font-size:18px}.pill{background:#102b25cc;border:1px solid #31534b;border-radius:99px;padding:8px 12px;font-size:12px;backdrop-filter:blur(12px)}.map{height:58vh;min-height:440px;position:relative;background:radial-gradient(circle at 65% 42%,#31554b 0 2px,transparent 3px),linear-gradient(135deg,#17332d,#24443b 45%,#142d28);overflow:hidden}.map:before,.map:after{content:"";position:absolute;background:#d0b36b22;transform:rotate(-25deg);height:3px;width:140%;top:48%;right:-20%;box-shadow:0 75px #d0b36b18,0 -100px #d0b36b15}.map:after{transform:rotate(32deg);top:55%;background:#ffffff12;box-shadow:0 90px #ffffff0c,0 -125px #ffffff0c}.pin{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);width:24px;height:24px;border-radius:50% 50% 50% 0;background:#d9b86b;transform-origin:center;rotate:-45deg;box-shadow:0 0 0 8px #d9b86b25,0 0 35px #d9b86b77}.pin i{display:block;width:8px;height:8px;background:#fff;border-radius:50%;margin:8px}.maplabel{position:absolute;bottom:22px;right:18px;left:18px;background:#081815dd;border:1px solid #31534b;border-radius:22px;padding:14px;backdrop-filter:blur(14px)}.maplabel b{display:block;font-size:16px}.maplabel span{font-size:12px;color:#b9c7c0}.sheet{margin-top:-28px;position:relative;z-index:3;background:#0b1e1a;border-radius:30px 30px 0 0;padding:24px 18px 110px;min-height:46vh}.eyebrow{color:#d9b86b;font-size:12px;font-weight:800}.title{font-size:27px;font-weight:900;margin:5px 0 16px}.ai{background:linear-gradient(145deg,#112c25,#0d241f);border:1px solid #31534b;border-radius:24px;padding:18px}.aihead{display:flex;gap:11px;align-items:center}.avatar{width:42px;height:42px;border-radius:14px;background:#d9b86b;color:#071714;display:grid;place-items:center;font-weight:1000}.aihead strong{display:block}.aihead small{color:#91a49d}.msg{line-height:1.8;color:#e7e5dc;margin:15px 0}.actions{display:flex;gap:9px}.actions button{flex:1;padding:12px;border-radius:14px;background:#17382f;color:#fff}.actions .primary{background:#d9b86b;color:#071714;font-weight:800}.next{margin-top:14px;padding:16px;border:1px solid #2a4a42;border-radius:20px;display:flex;justify-content:space-between;align-items:center}.next small{color:#91a49d}.next b{display:block;margin-top:3px}.nav{position:fixed;z-index:10;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:#081815ed;backdrop-filter:blur(18px);border-top:1px solid #23423a;display:flex;justify-content:space-around}.nav button{background:none;color:#71847e;font-size:11px}.nav button.active{color:#d9b86b}.nav b{display:block;font-size:20px;margin-bottom:3px}.toast{position:fixed;z-index:20;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;background:#f7f4ea;color:#071714;padding:12px 16px;border-radius:14px;transition:.25s;font-size:13px}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style></head><body><main class="app"><header class="top"><div class="brand">SAHEB AI</div><div class="pill" id="status">● تحديد الموقع</div></header><section class="map"><div class="pin"></div><div class="maplabel"><b id="place">أنت في الجولة</b><span id="coords">اضغط ابدأ الجولة لتفعيل موقعك</span></div></section><section class="sheet"><div class="eyebrow">رفيقك في المكان</div><div class="title">خلّني أمشي معك.</div><div class="ai"><div class="aihead"><div class="avatar">ص</div><div><strong>صاحب</strong><small>مرشدك الذكي</small></div></div><div class="msg" id="msg">أهلًا، أنا صاحب. فعّل الجولة وسأتابع موقعك وأخبرك عن الأماكن المهمة حولك.</div><div class="actions"><button class="primary" id="start">ابدأ الجولة</button><button id="speak">اسمعني</button></div></div><div class="next"><div><small>الخطوة التالية</small><b id="suggest">سأقترح عليك أقرب مكان يستحق الزيارة.</b></div><span>›</span></div></section><nav class="nav"><button class="active"><b>⌖</b>اكتشف</button><button><b>◷</b>رحلتي</button><button><b>●</b>صاحب</button></nav><div class="toast" id="toast"></div></main><script>
let watch=null,started=false;const $=id=>document.getElementById(id);function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2600)}function say(t){if(!('speechSynthesis'in window))return toast('الصوت غير مدعوم في هذا المتصفح');speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ar-SA';u.rate=.92;speechSynthesis.speak(u)}function setLocation(p){$('coords').textContent=`${p.coords.latitude.toFixed(5)}, ${p.coords.longitude.toFixed(5)}`;$('status').textContent='● الموقع نشط'}$('start').onclick=()=>{if(started){started=false;if(watch!==null)navigator.geolocation.clearWatch(watch);$('start').textContent='ابدأ الجولة';$('msg').textContent='أوقفت الجولة. عندما تريد نكمل من مكانك.';$('status').textContent='● تحديد الموقع';return}if(!navigator.geolocation)return toast('المتصفح لا يدعم GPS');started=true;$('start').textContent='إيقاف الجولة';$('msg').textContent='أنا معك الآن. تحرك، وسأتابع موقعك وأساعدك في اكتشاف الأماكن المهمة.';say('أهلًا، أنا صاحب. أنا معك في الجولة.');watch=navigator.geolocation.watchPosition(p=>{setLocation(p);$('place').textContent='موقعك الحالي';$('suggest').textContent='أبحث عن أفضل مكان قريب منك…'},e=>{toast(e.code===1?'اسمح للموقع من إعدادات المتصفح.':'تعذر تحديد موقعك');$('status').textContent='● الموقع غير متاح'},{enableHighAccuracy:true,maximumAge:5000,timeout:15000})};$('speak').onclick=()=>say($('msg').textContent);</script></body></html>
